[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = "pyos"
dynamic = ["version"]
description = "Browse python objects as if they were files on disk"
readme = "README.rst"
authors = [
    {name = "Martin Uhrin", email = "martin.uhrin.10@ucl.ac.uk"}
]
license = {file = "LICENSE"}
classifiers = [
    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = ["database", "schemaless", "nosql", "orm", "object-store", "concurrent", "optimistic-locking"]
requires-python = ">=3.11"
dependencies = [
    "anytree",
    "cmd2>=3.5.1, <4",
    "columnize",
    "mincepy>=0.19.0.dev1, <0.20",
    "click",
    "ipython",
    "pandas",
    "pymongo",
    "pyprnt",
    "pytray >= 0.3.0",
    "stevedore",
    "tqdm",
    "yarl"
]

[project.optional-dependencies]
gui = ["mincepy[gui]"]
dev = [
    "hatchling",
    "ipykernel",
    "ipython",
    "jupyter-sphinx",
    "nbclient",
    "nbsphinx",
    "pip",
    "pytest>4",
    "pytest-cov",
    "pre-commit",
    "sphinx",
    "sphinx-autobuild",
    "ruff",
    "ty==0.0.89",  # Pinned as new releases add checks
]

[project.urls]
Documentation = "https://pyos.readthedocs.org/"
Source = "https://github.com/muhrin/pyos/"

[project.scripts]
pyos = "pyos.cli:pyos"
psh = "pyos.cli:psh_"

[project.entry-points."mincepy.plugins.types"]
pyos_types = "pyos.provides:get_types"

[tool.hatch.version]
path = 'src/pyos/version.py'

[tool.hatch.build.targets.sdist]
include = [
    '/src',
    '/README.rst',
]

[tool.bandit]
exclude_dirs = ["test/"]
skips = ["B101"]

[tool.docformatter]
wrap-summaries = 100
wrap-descriptions = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "C90",  # mccabe complexity
    "I",  # isort
    "FLY",  # flynt
    "UP009",  # no utf-8 encoding declarations
    "A",  # shadowing builtins
    "B",  # bugbear: likely bugs and design problems
    "PL",  # pylint
]
ignore = [
    "E501",  # line length is handled by the formatter
    "F401",
    "F403",
    "PLC0415",  # imports outside top level are used to avoid circular imports
    "PLR2004",  # magic value comparisons
    "PLW1641",  # __eq__ without __hash__ (Python already makes these unhashable)
]

[tool.ruff.lint.per-file-ignores]
# Notebooks often use star imports for brevity
"*.ipynb" = ["F405"]
# Sphinx needs a variable called 'copyright'
"docs/source/conf.py" = ["A001"]
# The flags (e.g. ls -l) are deliberately single letters
"src/pyos/psh/flags.py" = ["E741"]

[tool.ruff.lint.flake8-builtins]
# These shadow builtins but are part of the public API (and mirror the shell commands)
ignorelist = ["filter", "id", "type", "open", "help", "input", "format", "dir"]

[tool.ruff.lint.pylint]
# The previous pylint settings
max-args = 14
max-branches = 14
max-locals = 20
max-positional-args = 8
max-returns = 8

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "test"]
# Files that do not pass ty yet.  Please remove files from this list as they are fixed so that
# they are checked from then on, the aim being to remove the list altogether.
exclude = [
    "src/pyos/db/fs.py",
    "src/pyos/db/lib.py",
    "src/pyos/db/migrations.py",
    "src/pyos/db/schema.py",
    "src/pyos/fs/nodes.py",
    "src/pyos/fs/utils.py",
    "src/pyos/_globals.py",
    "src/pyos/glob.py",
    "src/pyos/os/nodb.py",
    "src/pyos/os/withdb.py",
    "src/pyos/pathlib.py",
    "src/pyos/psh/argparse_types.py",
    "src/pyos/psh/cmds/connect.py",
    "src/pyos/psh/cmds/find.py",
    "src/pyos/psh/cmds/log.py",
    "src/pyos/psh/cmds/pwd.py",
    "src/pyos/psh/cmds/rsync.py",
    "src/pyos/psh/completion.py",
    "src/pyos/psh_lib/opts.py",
    "src/pyos/psh/shell.py",
    "src/pyos/psh/utils.py",
    "src/pyos/results.py",
    "src/pyos/_sessions.py",
    "test/db/test_fs.py",
    "test/fs/test_dir_nodes.py",
    "test/psh/conftest.py",
    "test/psh_lib/test_results.py",
    "test/psh/test_completion.py",
    "test/support.py",
    "test/utils.py",
]
